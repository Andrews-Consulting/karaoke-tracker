# Every pull request runs the whole suite: the unit guards (which also keep
# docs/REQUIREMENTS.md and sw.js honest) and the e2e suite on mobile Chromium
# and mobile WebKit, and is checked for a version bump when it changes a
# cached file (tools/check-version.js), since installed copies only update
# when APP_VERSION changes. Pull requests only: a push to dev would run the
# same commit again once the PR opens. Make these required checks in the
# branch protection for main so a PR cannot merge without them.
name: CI

on:
  pull_request:

jobs:
  test:
    name: Unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Normally under a minute. The apt half can stall on a slow Ubuntu mirror
      # (42 of 185 packages in 14 minutes on 2026-11-17): fail fast, re-run.
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 15
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  version:
    name: Version bumped when cached files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-version.js origin/${{ github.base_ref }}
