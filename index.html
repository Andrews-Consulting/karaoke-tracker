<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Karaoke Tracker</title>

  <meta name="theme-color" content="#14121a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- iPhone home screen (R29) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karaoke">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1 id="view-title">Songs</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-view="songs" aria-current="page">Songs</button>
    <button type="button" data-view="setlists">Setlists</button>
    <button type="button" data-view="venues">Venues</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
