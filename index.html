<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mic Jaunt</title>

  <meta name="theme-color" content="#14121a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- iPhone home screen (R29) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mic Jaunt">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    // R32: apply the saved theme before the first paint, so there is no flash.
    // js/theme.js keeps it current after that.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light'
          || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.dataset.theme = 'light';
      }
      var savedAccent = localStorage.getItem('accent'); // R55; green needs no attribute
      if (savedAccent === 'amber' || savedAccent === 'lime' || savedAccent === 'pink') {
        document.documentElement.dataset.accent = savedAccent;
      }
    } catch (e) { /* storage blocked: stay dark */ }
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- R58: no title bar; the selected tab shows where you are. The page name
       stays for screen readers and prints at the top of a printout. -->
  <h1 id="view-title" class="visually-hidden">Songs</h1>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-view="songs" aria-current="page">Songs</button>
    <button type="button" data-view="setlists">Setlists</button>
    <button type="button" data-view="venues">Venues</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
