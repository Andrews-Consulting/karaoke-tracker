<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sung: next song for the KJ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#05070A}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#6CC4FF}a:hover{color:#A8DCFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #05070A; color: #E8EEF4; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.3">

<section aria-labelledby="b6-title" style="position: absolute; top: 40px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 34px; background: #000000; border-top: 1px solid #27313C; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A4757"></span>

<div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 4px 0 12px; border-radius: 12px; background: #151B22; border: 1px solid #27313C">
<span style="display: flex; color: {{accent}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<p style="margin: 0; flex: 1; min-width: 0; font-size: 14px; color: #C3CDD7">Folsom Prison Blues logged at The Crown</p>
<button aria-label="Undo: Folsom Prison Blues goes back to up next" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; border-radius: 8px; background: none; border: 0; font-size: 14px; font-weight: 600; color: {{accent}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg>Undo</button>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.1em; color: #A3B0BD">UP NEXT FOR THE KJ</p>
<h1 id="b6-title" style="margin: 0; font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: #FFFFFF">Moondance</h1>
<p style="margin: 4px 0 0; font-size: 34px; font-weight: 500; line-height: 1.1; color: #DCE3EA">Van Morrison</p>
<div style="display: flex; align-items: flex-end; gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #27313C">
<div style="display: flex; flex-direction: column">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; letter-spacing: 0.1em; color: #A3B0BD">KEY</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 110px; font-weight: 600; line-height: 0.9; letter-spacing: -0.04em; color: {{accent}}">−2</span>
</div>
<span style="margin-bottom: 10px; font-size: 20px; line-height: 1.2; color: #C3CDD7">two semitones<br>down</span>
</div>
</div>

<button style="height: 60px; border-radius: 14px; background: none; border: 1.5px solid #E8EEF4; color: #FFFFFF; font-size: 18px; font-weight: 600">Done</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CC4FF","options":["#6CC4FF","#B6F26B","#FFB86B","#D3A6FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#6CC4FF';
    return { accent: a };
  }
}
</script>
</body>
</html>
