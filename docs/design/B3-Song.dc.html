<div style="display: flex; align-items: center; gap: 10px; min-height: 58px; border-bottom: 1px solid #1E2731">

<button style="height: 44px; border-radius: 10px; border: 0; background: none; color: #A3B0BD; font-size: 14px; font-weight: 500">Tonight</button>
<button aria-current="page" style="height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 10px; border: 0; background: #1C242D; color: #E8EEF4; font-size: 14px; font-weight: 600">Songs<span aria-hidden="true" style="width: 18px; height: 3px; border-radius: 2px; background: {{accent}}"></span></button>
<button style="height: 44px; border-radius: 10px; border: 0; background: none; color: #A3B0BD; font-size: 14px; font-weight: 500">Lists</button>
<button style="height: 44px; border-radius: 10px; border: 0; background: none; color: #A3B0BD; font-size: 14px; font-weight: 500">History</button>
